spring.application.name=ecommerce-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_BYTES
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5180

# Optional Razorpay settings.
# Add real values only when you enable live/test payment creation.
razorpay.key-id=YOUR_RAZORPAY_KEY_ID
razorpay.key-secret=YOUR_RAZORPAY_KEY_SECRET
